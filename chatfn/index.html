<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>(1) WhatsApp</title>
  
  <meta name="description" content="Método Canal Dark - Atendimento">
  <meta property="og:type" content="website">
  <meta property="og:title" content="(1) WhatsApp">
  <meta property="og:description" content="Método Canal Dark">
  <meta property="og:image" content="assets/avatar.png">
  <link rel="icon" type="image/png" href="assets/avatar.png">
  
  <!-- CSS Styles -->
  <link rel="stylesheet" href="style.css">

  <!-- Configurações do Funil -->
  <script src="config.js"></script>

  </script>
</head>
<body>

  <div id="app-container">
    <!-- WhatsApp Header -->
    <header class="wa-header">
      <div class="wa-header-left">
        <div class="wa-back-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </div>
        <div class="wa-avatar-container">
          <img id="profile-avatar" src="assets/avatar.png" alt="Avatar">
        </div>
        <div class="wa-profile-info">
          <div class="wa-profile-name">
            <span id="profile-name">Chapéu Preto</span>
            <span class="wa-verified-badge" title="Verificado">
              <svg viewBox="0 0 18 18" height="17" width="17">
                <polygon fill="#00DA60" points="9,16 7.1,16.9 5.8,15.2 3.7,15.1 3.4,13 1.5,12 2.2,9.9 1.1,8.2 2.6,6.7 2.4,4.6 4.5,4 5.3,2 7.4,2.4 9,1.1 10.7,2.4 12.7,2 13.6,4 15.6,4.6 15.5,6.7 17,8.2 15.9,9.9 16.5,12 14.7,13 14.3,15.1 12.2,15.2 10.9,16.9"/>
                <polygon fill="#FFFFFF" points="13.1,7.3 12.2,6.5 8.1,10.6 5.9,8.5 5,9.4 8,12.4"/>
              </svg>
            </span>
          </div>
          <div id="profile-status" class="wa-profile-status">Online</div>
        </div>
      </div>

      <div class="wa-header-actions">
        <div class="wa-action-icon" title="Chamada de Vídeo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
          </svg>
        </div>
        <div class="wa-action-icon" title="Ligar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 00-1.01.24l-1.57 1.97c-2.83-1.44-5.15-3.75-6.59-6.59l1.97-1.57c.28-.27.36-.67.25-1.02A11.36 11.36 0 019 4.31a1 1 0 00-1-1H4.5c-.55 0-1 .45-1 1C3.5 13.06 10.94 20.5 20.01 20.5c.55 0 1-.45 1-1v-3.62c0-.55-.45-1-1-1z"/>
          </svg>
        </div>
        <div class="wa-action-icon" title="Mais Opções">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
          </svg>
        </div>
      </div>
    </header>

    <!-- Chat Messages Scroll Area -->
    <main class="wa-chat-area" id="chat-area">
      <!-- Commercial Account Badge -->
      <div class="wa-info-notice">
        <svg width="16" height="16" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
        </svg>
        <span>Esta é uma conta comercial</span>
      </div>
    </main>

    <!-- Bottom Action / Buttons Bar -->
    <footer class="wa-bottom-bar" id="bottom-bar">
      <div class="wa-options-container" id="options-container">
        <!-- Buttons injected dynamically -->
      </div>
    </footer>
  </div>

  <!-- Image Lightbox Modal -->
  <div id="img-modal" class="img-modal">
    <img id="modal-img" src="" alt="Zoom">
  </div>

  <!-- Audio Element -->
  <audio id="audio-notification" preload="auto"></audio>

  <!-- Script Principal -->
  <script src="script.js"></script>
</body>
</html>
